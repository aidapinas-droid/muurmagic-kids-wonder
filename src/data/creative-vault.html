<style>
:root{--ink:#241820;--soft:#5c4b55;--paper:#f4efe8;--card:#fffaf5;--line:rgba(36,24,32,.08);--berry:#c44768;--shadow:0 10px 30px rgba(56,28,40,.08);--nav:74px}
*{box-sizing:border-box} body{margin:0;font-family:Outfit,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(900px 420px at 10% -10%,#f8d7c8 0%,transparent 55%),radial-gradient(700px 380px at 110% 0%,#ead7f1 0%,transparent 50%),var(--paper)}
button,input{font:inherit;color:inherit} button{cursor:pointer} .app{width:min(1120px,100%);margin:0 auto;padding:18px 16px calc(var(--nav) + 28px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px} .brand{display:flex;gap:10px;align-items:center}
.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:conic-gradient(from 210deg,#c44768,#e0a15d,#2f8b74,#61456d,#c44768)}
.mark span{width:28px;height:28px;border-radius:9px;background:#fffaf5;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;color:#8d2e4a}
h1{font-family:Fraunces,Georgia,serif;font-size:1.35rem;margin:0} .brand small{display:block;color:var(--soft);font-size:.75rem;margin-top:3px}
.pill{border:1px solid var(--line);background:rgba(255,250,245,.8);border-radius:999px;padding:7px 10px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:#61456d;font-weight:650}
.search-wrap{position:sticky;top:0;z-index:5;padding:8px 0 12px;background:linear-gradient(var(--paper),rgba(244,239,232,.92) 70%,transparent)}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;min-height:56px;padding:0 14px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:1rem} .search button{border:0;background:#efe4dc;border-radius:999px;min-width:36px;height:36px}
.hint{color:var(--soft);font-size:.78rem;margin:8px 2px 0} .banner{background:#2a1c24;color:#f8efe8;border-radius:22px;padding:16px;margin:6px 0 16px}
.banner strong{font-family:Fraunces,Georgia,serif;font-size:1.15rem} .banner p{margin:6px 0 0;color:#e6d5cc;font-size:.9rem;line-height:1.4}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px} .section-h h2{font-family:Fraunces,Georgia,serif;font-size:1.28rem;margin:0}
.section-h span,.muted{color:var(--soft);font-size:.82rem}
.cat-grid,.theme-grid,.card-list{display:grid;gap:12px} .cat-grid,.theme-grid{grid-template-columns:1fr 1fr}
.cat,.theme,.card,.detail,.empty{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.cat,.theme{text-align:left;padding:0;overflow:hidden;min-height:112px} .swatch{height:58px;display:flex;align-items:flex-end;padding:10px 12px;color:#fff;font-size:.72rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.cat div,.theme .body,.card .body{padding:12px} .cat strong,.theme strong{display:block} .cat em,.theme em,.card p{font-style:normal;color:var(--soft);font-size:.78rem;display:block;margin-top:4px}
.card{display:grid;grid-template-columns:96px 1fr;min-height:116px;overflow:hidden;text-align:left;padding:0;width:100%}
.thumb{min-height:116px;position:relative;background:#efe4dc center/cover no-repeat} .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;background:rgba(36,24,32,.78);color:#fff;border-radius:999px;font-size:.64rem;padding:4px 7px}
.card h3{margin:0;font-family:Fraunces,Georgia,serif;font-weight:560;font-size:1.02rem} .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:#f3e7df;border-radius:999px;padding:4px 8px;font-size:.7rem;color:#6a4d57} .ok{background:#e5f3ee;color:#1f6b58} .wait{background:#f8ead8;color:#8a5a22}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px} .actions a,.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 12px;border-radius:12px;text-decoration:none;border:0;font-weight:650;font-size:.82rem}
.primary{background:var(--berry);color:#fff} .secondary{background:#efe4dc;color:var(--ink)} .ghost{background:transparent;border:1px solid var(--line)!important}
.empty{padding:22px;text-align:center} .detail-screen{display:none} .detail-screen.open{display:block} .library.hidden{display:none}
.detail{padding:14px} .hero{height:170px;border-radius:16px;overflow:hidden;background:#efe4dc center/cover no-repeat;position:relative} .hero img{width:100%;height:100%;object-fit:cover}
.kicker{color:#8d2e4a;font-size:.75rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px} .detail h2{font-family:Fraunces,Georgia,serif;margin:0 0 6px;font-size:1.6rem}
.path{font-size:.8rem;color:var(--soft);line-height:1.4;word-break:break-word} .child{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;margin-top:8px} .child strong{display:block} .child span{color:var(--soft);font-size:.78rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px} .filter{border:1px solid var(--line);background:rgba(255,250,245,.75);border-radius:999px;padding:10px 14px;white-space:nowrap;min-height:42px}
.filter.active{background:var(--ink);color:#fffaf5}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,250,245,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:transparent;border-radius:14px;min-height:56px;font-size:.68rem;color:var(--soft)} nav.bottom button.active{background:#2a1c24;color:#fff}
.sheet{position:fixed;inset:0;background:rgba(36,24,32,.42);z-index:30;display:none;align-items:flex-end;justify-content:center} .sheet.open{display:flex}
.sheet .panel{width:min(560px,100%);background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{font-family:Fraunces,Georgia,serif;margin:4px 0 12px} .sheet button.row{width:100%;text-align:left;border:0;background:#f6efe8;border-radius:14px;min-height:48px;margin-bottom:8px;padding:0 14px}
@media(min-width:800px){.cat-grid{grid-template-columns:repeat(4,1fr)}.theme-grid{grid-template-columns:repeat(4,1fr)}.card-list.wide{grid-template-columns:1fr 1fr} nav.bottom{width:min(1120px,calc(100% - 32px));left:50%;transform:translateX(-50%);border-radius:22px 22px 0 0}}
.worlds{display:grid;grid-template-columns:1.2fr 1.4fr .7fr;gap:8px;margin:8px 0 4px}.world{min-height:48px;border-radius:16px;border:1px solid var(--line);background:rgba(255,250,245,.8);font-weight:650}.world.active{background:#2a1c24;color:#fffaf5}.src{opacity:.72}</style>

,"vocales","worksheet"],"accent":"#2f8b74","pairing":"structure","blurb":"Number and handwriting booklets. Individual PDFs stay in Drive.","children":[],"world":"kids","use":"Worksheets & learning","format":"PDF","source":"Pack Educativos"},{"id":"src-edu","kind":"collection","category":"source","preset":true,"theme":"School","originalTitle":"05 - REGALO #4_ Pack Educativos","titleEn":"Educational pack","sourcePath":"05 - REGALO #4_ Pack Educativos","driveUrl":"https://drive.google.com/drive/folders/1So9yv36j3xoby5WxAcmOErOQDUsU1VZS","tags":["educativo","school","agenda","cuento"],"accent":"#2f8b74","pairing":"structure","blurb":"School agendas, stories, teacher files and children's books. Adult sales receipts in the same folder were not promoted.","children":["src-cuentos","edu-agenda","edu-teacher","edu-libros"],"world":"kids","use":"Educational resources","format":"Folder","source":"Pack Educativos"},{"id":"src-crochet","kind":"collection","category":"source","preset":true,"theme":"Crochet","originalTitle":"300+ Crochet Patterns Mega Bundle","titleEn":"Crochet patterns","sourcePath":"300+ Crochet Patterns Mega Bundle","driveUrl":"https://drive.google.com/drive/folders/1R2g50pDUn6hjRj_gIjZaWp7WdCYVwKky","tags":["crochet","haken","amigurumi","pattern"],"accent":"#2f8b74","pairing":"structure","blurb":"About 300 pattern folders: amigurumi, hats, doll clothes and home items. Not expanded into cards.","children":[],"world":"kids","use":"Crafts & makeables","format":"PDF","source":"300+ Crochet Patterns"},{"id":"src-fonts","kind":"collection","category":"source","preset":true,"theme":"Fonts","originalTitle":"Kids-Font-Collection-Bundle","titleEn":"Kids font collection","sourcePath":"Kids-Font-Collection-Bundle","driveUrl":"https://drive.google.com/drive/folders/12u-AXXrgMFsBSbqXqeB0Y0ZYNoooGYSN","tags":["font","lettertype","fuente","kids"],"accent":"#2f8b74","pairing":"structure","blurb":"Display font families with bonus folders. Families are not individual cards.","children":[],"world":"kids","use":"Clipart, backgrounds & fonts","format":"Font","source":"Kids Font Collection"}]</script>
<script>
const items = JSON.parse(document.getElementById("data").textContent);
const byId = Object.fromEntries(items.map(x => [x.id, x]));
const SYNONYMS = [["heks","witch","bruja","brujita","bruxa","bruxhina"],["blauw","bluey"],["dinosaurus","dinosaur","dinosaurio","dino","dinosauro","dinasour"],["verjaardag","verjaardagen","birthday","cumpleanos","feest","party","fiesta"],["haken","crochet","haak"],["kleuren","coloring","colorear"],["verhaal","story","cuento","bedtime"],["drukboek","busy book","quiet book"],["prinses","princess","princesa"],["eenhoorn","unicorn","unicornio"],["zeemeermin","mermaid","sirena","sirenita"],["taarttopper","cakeprikker","topper"],["uitnodiging","invitation","invitacion"],["doos","box","caja","cajitas","gable"],["feest","party","fiesta"],["bonus","bono"],["kleuren","coloring","colorear"],["overtrekken","tracing","trazar"]];
function classify(item){ if(item.preset) return;
  const n=(item.originalTitle+" "+(item.tags||[]).join(" ")).toLowerCase();
  let use="Party printables", world="party", format=item.canvaUrl?"Canva":"PDF";
  if(/jpg|jpeg|png/.test(n) || item.contentType==="JPEG") format="JPG/PNG";
  if(/powerpoint/.test(n)) format="PowerPoint";
  if(/studio/.test(n)) format="Studio";
  if(/libritos para colorear|colorear|coloring/.test(n)){use="Coloring"; world="kids"}
  else if(/flores de papel|papel/.test(n) && /bono 4/.test(n)){use="Crafts & makeables"; world="kids"}
  else if(/etiquetas escolares/.test(n)){use="Worksheets & learning"; world="kids"}
  else if(/topper|bruxhina|letras a-z/.test(n)) use="Cake toppers";
  else if(/caja|gable|molde|packaging/.test(n)) use="Boxes & packaging";
  else if(/invitacion|invitation/.test(n)) use="Invitations & favors";
  else if(/mockup/.test(n)) use="Decorations";
  else if(/clipart|fondo|sublim/.test(n)) use="Party assets";
  else if(/calendario|checklist|tutorial|guia|guía|emprender/.test(n)) use="Planning & guides";
  else if(/canva|plantilla/.test(n)) use="Party printables";
  return {world, use, format, source:"Candy_Party", theme:item.theme||""};
}
items.forEach(it=>{ Object.assign(it, classify(it)); });
const planned = {
  party:[
    ["Candy_Party","Indexed","Party templates, boxes, toppers, decorations"],
    ["100+ Canva Party Favor Templates","Indexed","76 Canva favor links plus file bundles"],
    ["CAJITAS BLUEY","Indexed","Bluey box PDFs and Studio files"]
  ],
  kids:[
    ["15K+ Coloring Book Pages","Indexed","52 theme folders"],
    ["Tracing","Indexed","Seven skill folders"],
    ["Printables for Kids - 101","Indexed","Worksheet and tracing PDFs"],
    ["50 LIBROS INTERACTIVOS","Indexed","Character interactive books"],
    ["Busy Book-v01-French","Indexed","Quiet-book project"],
    ["101 Kids Bedtime Stories","Indexed","Story collection"],
    ["Pack Educativos","Indexed","Agendas, stories, teacher files"],
    ["300+ Crochet Patterns","Indexed","Pattern collection, not expanded"],
    ["Kids Font Collection","Indexed","Font families, not expanded"]
  ]
};
const partyUses=["Party printables","Invitations & favors","Boxes & packaging","Cake toppers","Decorations","Party assets","Planning & guides"];
const kidsUses=["Coloring","Tracing & early writing","Worksheets & learning","Interactive & busy books","Stories","Crafts & makeables","Educational resources"];
let world="all", view="home", filter="all";
function norm(s){return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function tokens(q){return norm(q).split(/[^a-z0-9+]+/).filter(t=>t&&t.length>1)}
function matches(item,q){const ts=tokens(q); if(!ts.length) return true; const hay=norm([item.originalTitle,item.titleEn,item.theme,item.use,item.source,item.format,...(item.tags||[])].join(" ")); return ts.every(t=>{ if(hay.includes(t)) return true; const g=SYNONYMS.find(x=>x.includes(t)); return g?g.some(w=>hay.includes(norm(w))):false })}
function scoped(list){ return world==="all"?list:list.filter(x=>x.world===world) }
function visible(){ let list=items.filter(x=>!x.hidden); const q=document.getElementById("q").value.trim(); if(q) list=items.filter(x=>matches(x,q)&&!x.hidden); list=scoped(list); if(filter!=="all") list=list.filter(x=>x.use===filter); return list }
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"\u0026amp;","<":"\u0026lt;",">":"\u0026gt;","\"":"\u0026quot;"})[c])}
function card(item){return `<button class="card" data-open="${esc(item.id)}"><div class="thumb" style="background:${esc(item.accent||"#c44768")}"><span class="badge">${esc(item.format||item.kind)}</span></div><div class="body"><h3>${esc(item.titleEn)}</h3><p>${esc(item.originalTitle)}</p><div class="meta"><span class="tag">${esc(item.use)}</span><span class="tag">${esc(item.theme||"")}</span><span class="tag">${esc(item.source)}</span></div></div></button>`}
function sourceCard(name,state,note){return `<article class="card src"><div class="thumb" style="background:#61456d"><span class="badge">${esc(state)}</span></div><div class="body"><h3>${esc(name)}</h3><p>${esc(note)}</p><div class="meta"><span class="tag">Source</span></div></div></article>`}
function setWorld(w){ world=w; view=w==="all"?"home":w; filter="all"; document.querySelectorAll(".world").forEach(b=>b.classList.toggle("active", b.dataset.world===w)); document.getElementById("hint").textContent = w==="party"?"Party only. Birthday, favors, boxes, toppers and decorations.":w==="kids"?"Kids & Creative only. Activities, books, crafts and learning.":"All searches both worlds. Inside Party, results stay in Party."; closeDetail() }
const detailStack=[];
function openDetail(id, fromChild){ const item=byId[id]; if(!item) return; if(!fromChild) detailStack.length=0; detailStack.push(id); document.getElementById("library").classList.add("hidden"); const el=document.getElementById("detail"); el.classList.add("open"); const kids=(item.children||[]).map(cid=>byId[cid]).filter(Boolean); el.innerHTML=`<article class="detail"><button class="back secondary" id="back">Back</button><div class="kicker">${esc(item.world)} · ${esc(item.use)}</div><h2>${esc(item.titleEn)}</h2><p>${esc(item.blurb||"")}</p><p class="path"><strong>Theme.</strong> ${esc(item.theme||"—")}<br><strong>Format.</strong> ${esc(item.format)}<br><strong>Source.</strong> ${esc(item.source)}<br><strong>Path.</strong> ${esc(item.sourcePath||"")}</p><div class="actions">${item.canvaUrl?`<a class="primary" href="${esc(item.canvaUrl)}" target="_blank" rel="noopener">Open in Canva</a>`:""}${item.driveUrl?`<a class="secondary" href="${esc(item.driveUrl)}" target="_blank" rel="noopener">Open in Drive</a>`:""}</div>${kids.map(k=>`<button class="child" data-open="${esc(k.id)}"><strong>${esc(k.titleEn)}</strong><span>${esc(k.use)} · ${esc(k.format)}</span></button>`).join("")}</article>`; document.getElementById("back").onclick=()=>{ detailStack.pop(); const prev=detailStack.pop(); if(prev) openDetail(prev,true); else closeDetail(); }; el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open,true)); }
function closeDetail(){ document.getElementById("detail").classList.remove("open"); document.getElementById("library").classList.remove("hidden"); render() }
function render(){
  const root=document.getElementById("view");
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("active", b.dataset.view===view || (view==="home"&&b.dataset.view==="home")));
  const q=document.getElementById("q").value.trim();
  if(q){ const list=visible().slice(0,40); root.innerHTML=`<div class="section-h"><h2>${world==="all"?"Both worlds":world==="party"?"Party":"Kids & Creative"}</h2><span>${visible().length}</span></div><div class="card-list wide">${list.map(card).join("")||`<div class="empty">No match in this scope.</div>`}</div>`; }
  else if(view==="home"){
    root.innerHTML=`<section class="banner"><strong>Surveyed sources are ingested.</strong><p>Party is its own world. Kids & Creative is the other. Canva is a format, not a category. Party and Kids stay separate. Search from All covers both.</p></section>
      <div class="section-h"><h2>Enter Party</h2></div><div class="cat-grid">${partyUses.slice(0,4).map(u=>`<button class="cat" data-jump="party" data-use="${esc(u)}"><div class="swatch" style="background:#c44768">Party</div><div><strong>${esc(u)}</strong><em>Candy_Party for now</em></div></button>`).join("")}</div>
      <div class="section-h"><h2>Kids & Creative</h2></div><div class="cat-grid">${kidsUses.slice(0,4).map(u=>`<button class="cat" data-jump="kids" data-use="${esc(u)}"><div class="swatch" style="background:#2f8b74">Kids</div><div><strong>${esc(u)}</strong><em>Waiting for ingest</em></div></button>`).join("")}</div>`;
  } else if(view==="party"||view==="kids"){
    const uses=view==="party"?partyUses:kidsUses;
    const src=planned[view];
    root.innerHTML=`<div class="section-h"><h2>${view==="party"?"Party":"Kids & Creative"}</h2><span>${visible().length} indexed</span></div>
      <div class="filters"><button class="filter ${filter==="all"?"active":""}" data-filter="all">All uses</button>${uses.map(u=>`<button class="filter ${filter===u?"active":""}" data-filter="${esc(u)}">${esc(u)}</button>`).join("")}</div>
      <div class="section-h"><h2>Sources</h2></div><div class="card-list">${src.map(s=>sourceCard(...s)).join("")}</div>
      <div class="section-h"><h2>Indexed resources</h2></div><div class="card-list wide">${visible().slice(0,24).map(card).join("")||`<div class="empty">No indexed resources in this use yet.</div>`}</div>`;
  } else {
    root.innerHTML=`<div class="section-h"><h2>Themes</h2><span>facet, not a world</span></div><div class="theme-grid">${items.filter(x=>x.category==="theme").slice(0,12).map(x=>`<button class="theme" data-open="${x.id}"><div class="swatch" style="background:${x.accent}">${esc(x.theme)}</div><div class="body"><strong>${esc(x.titleEn)}</strong><em>${esc(x.use)}</em></div></button>`).join("")}</div>`;
  }
  root.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  root.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ setWorld(b.dataset.jump); filter=b.dataset.use; view=b.dataset.jump; render() });
  root.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{ filter=b.dataset.filter; render() });
}
document.getElementById("q").addEventListener("input",()=>{document.getElementById("detail").classList.remove("open"); document.getElementById("library").classList.remove("hidden"); render()});
document.getElementById("clear").onclick=()=>{document.getElementById("q").value=""; render()};
document.querySelectorAll(".world").forEach(b=>b.onclick=()=>setWorld(b.dataset.world));
document.querySelectorAll("nav.bottom button").forEach(b=>b.onclick=()=>{
  if(b.dataset.view==="more"){ const uses=world==="kids"?kidsUses:partyUses; document.getElementById("sheetRows").innerHTML=uses.map(u=>`<button class="row" data-filter="${esc(u)}">${esc(u)}</button>`).join(""); document.getElementById("sheet").classList.add("open"); document.querySelectorAll("#sheetRows [data-filter]").forEach(r=>r.onclick=()=>{ filter=r.dataset.filter; view=world==="kids"?"kids":"party"; if(world==="all") setWorld("party"); document.getElementById("sheet").classList.remove("open"); render() }); return }
  if(b.dataset.view==="party") return setWorld("party");
  if(b.dataset.view==="kids") return setWorld("kids");
  view=b.dataset.view; if(b.dataset.view==="home") setWorld("all"); else closeDetail();
});
document.getElementById("sheet").onclick=e=>{ if(e.target.id==="sheet"||e.target.id==="closeSheet") document.getElementById("sheet").classList.remove("open") };
render();
</script>

</body></html>
